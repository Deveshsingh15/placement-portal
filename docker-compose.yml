version: '3.8'
services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
  app:
    build: .
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongo:27017/placement-portal
      - JWT_SECRET=change_me
      - ADMIN_SECRET=change_me
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - mongo
volumes:
  mongo-data:
